<!-- ============ STOPPER 2A — début du bloc à coller ============ -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="{{BLOCK_WIDTH}}" style="width:{{BLOCK_WIDTH}}px; max-width:100%; border-collapse:collapse; background-color:{{COLOR_BG}}; font-family:{{FONT_STACK}};">
  <tr>
    <td width="{{IMAGE_COL_WIDTH}}" valign="top" style="width:{{IMAGE_COL_WIDTH}}px; padding:0; background-color:{{COLOR_BG}};">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="{{IMAGE_COL_WIDTH}}" style="width:{{IMAGE_COL_WIDTH}}px; border-collapse:collapse;">
        <tr>
          <td style="padding:0; line-height:0;">
            <img src="{{PROMO_IMAGE_URL}}" alt="{{PROMO_IMAGE_ALT}}" width="{{IMAGE_COL_WIDTH}}" style="display:block; width:{{IMAGE_COL_WIDTH}}px; height:auto; border:0;">
          </td>
        </tr>
        <tr>
          <td style="padding:0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td style="background-color:{{COLOR_BADGE_BG}}; color:{{COLOR_BADGE_TEXT}}; padding:8px 14px; font-family:{{FONT_STACK}}; font-size:11px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; white-space:nowrap;">{{PROMO_BADGE}}</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>

    <td valign="middle" style="padding:26px 28px; background-color:{{COLOR_BG}};">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td valign="middle" width="{{LOGO_WIDTH}}" style="width:{{LOGO_WIDTH}}px; padding-right:22px;">
            <img src="{{LOGO_URL}}" alt="{{LOGO_ALT}}" width="{{LOGO_WIDTH}}" style="display:block; width:{{LOGO_WIDTH}}px; height:auto; border:0;">
          </td>
          <td width="1" style="width:1px; background-color:{{COLOR_RULE}}; font-size:0; line-height:0;">&nbsp;</td>
          <td valign="middle" style="padding-left:22px; font-family:{{FONT_STACK}};">

            <div style="font-size:20px; font-weight:bold; color:{{COLOR_TEXT}}; line-height:1.25; white-space:nowrap;">{{TAGLINE}}</div>
            <div style="font-size:14px; font-style:italic; color:{{COLOR_ACCENT}}; line-height:1.5; padding-top:10px; white-space:nowrap;">{{BASELINE}}</div>

            <div style="font-size:13px; color:{{COLOR_TEXT}}; line-height:1.55; padding-top:12px; white-space:nowrap;">
              {{ADDRESS}}&nbsp;&nbsp;<span style="color:{{COLOR_ACCENT}};">·</span>&nbsp;&nbsp;{{PHONE_LABEL}}&nbsp;: {{PHONE}}
            </div>
            <div style="font-size:13px; color:{{COLOR_TEXT_MUTED}}; line-height:1.55; padding-top:4px; white-space:nowrap;">
              {{VAT_LABEL}}&nbsp;: {{VAT}}&nbsp;&nbsp;<span style="color:{{COLOR_ACCENT}};">·</span>&nbsp;&nbsp;{{IBAN}}
            </div>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; margin-top:16px;">
              <tr>
                <td style="background-color:{{COLOR_CTA1_BG}}; border-radius:999px;">
                  <a href="{{CTA1_URL}}" style="display:inline-block; padding:11px 22px; font-family:{{FONT_STACK}}; font-size:13px; font-weight:bold; color:{{COLOR_CTA1_TEXT}}; text-decoration:none; white-space:nowrap;">{{CTA1_LABEL}}</a>
                </td>
                <td style="width:10px; font-size:0; line-height:0;">&nbsp;</td>
                <td style="background-color:{{COLOR_CTA2_BG}}; border-radius:999px;">
                  <a href="{{CTA2_URL}}" style="display:inline-block; padding:11px 22px; font-family:{{FONT_STACK}}; font-size:13px; font-weight:bold; color:{{COLOR_CTA2_TEXT}}; text-decoration:none; white-space:nowrap;">{{CTA2_LABEL}}</a>
                </td>
              </tr>
            </table>

          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<!-- ============ STOPPER 2A — fin du bloc ============ -->
