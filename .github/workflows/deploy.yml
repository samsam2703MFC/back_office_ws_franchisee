name: Deploy to server (SSH / rsync)

# Deploys the franchisee back-office (Claude Design DC app, run natively —
# same architecture as back_office_ws_franchisor) to the client server over
# SSH (rsync). Static site, no build step:
#   index.html (wired copy of back_office_ws_franchisee.dc.html)
#   + support.js (DC runtime) + bo_server.js (data layer, hydrate → /franchisee/*)
#   + api-config.js + _ds/ (design system + fonts) + img/
#   + vendor/ (React UMD, et Leaflet 1.9.4 — les cartes n'ont plus de CDN)
# Served at  http://<host>/webshop/backoffice_franchisee
#
# Secrets:  SSH_HOST · SSH_USER · SSH_PASSWORD
# Vars:     SSH_PORT (default 22)
#           DEPLOY_DIR absolute server dir mapped to /webshop/backoffice_franchisee
#                      (default /var/www/html/webshop/backoffice_franchisee)
#
#   • rsync runs WITHOUT --delete, so nothing else on the server is wiped.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          rm -rf site && mkdir -p site
          cp index.html back_office_ws_franchisee.dc.html support.js bo_server.js api-config.js site/
          # mail/ : le gabarit du pied de mail est un FICHIER que l'écran
          # « Signature de mail » charge à l'exécution (mail/stopper-2a.html).
          # Sans lui sur le serveur, l'aperçu répond 404 et l'écran le dit —
          # une copie du gabarit dans le code aurait menti sur ce que le client
          # reçoit, alors on livre le fichier lui-même.
          cp -r _ds vendor img mail site/
          ls -R site | head -50

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Prepare remote directory (validates SSH login)
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ vars.DEPLOY_DIR || '/var/www/html/webshop/backoffice_franchisee' }}' && command -v rsync >/dev/null || (echo 'rsync manquant sur le serveur — apt-get install -y rsync'; exit 1)"

      - name: Deploy → ${{ vars.DEPLOY_DIR || '/var/www/html/webshop/backoffice_franchisee' }}
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e rsync -rltDz --omit-dir-times \
            -e "ssh -p ${{ vars.SSH_PORT || '22' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.DEPLOY_DIR || '/var/www/html/webshop/backoffice_franchisee' }}/"

      - name: Verify the served page + assets (incl. fonts) on the server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s << 'REMOTE'
          BASE="http://localhost/webshop/backoffice_franchisee"
          DS="_ds/l-atelier-by-8504a4e3-7796-44da-b087-3fbd9dcb8dcd"
          echo "== served page references support.js =="
          curl -fsS "$BASE/" | grep -o './support.js' | head -1 || echo "WARN: support.js ref not found"
          echo "== asset status (code type bytes) =="
          fail=0
          # Leaflet est SERVI PAR NOUS depuis vendor/ : il n'a plus de CDN pour
          # le rattraper. Un déploiement qui le laisserait au vestiaire passerait
          # vert pendant que toutes les cartes de la console tombent — c'est
          # exactement ce que cette étape existe pour empêcher. Les images du
          # dossier images/ sont vérifiées par un fichier témoin (le CSS les
          # référence en relatif).
          for f in support.js bo_server.js api-config.js vendor/react.js vendor/react-dom.js \
                   vendor/leaflet/leaflet.js vendor/leaflet/leaflet.css \
                   vendor/leaflet/images/marker-icon.png \
                   $DS/global.css $DS/_ds_bundle.js \
                   $DS/fonts/GC_Vank.ttf $DS/fonts/Gotham_Regular_New.otf \
                   $DS/fonts/Gotham_Medium.otf $DS/fonts/Gotham_Regular.otf \
                   $DS/fonts/Gotham_Black.otf; do
            out=$(curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download}" "$BASE/$f")
            set -- $out; code=$1; type=$2; size=$3
            echo "  $code  $type  ${size}b  $f"
            case "$f" in
              */fonts/*) if [ "$code" != "200" ] || [ "${size:-0}" -lt 1000 ]; then echo "  ^ FONT NOT OK"; fail=1; fi ;;
              # Un serveur qui rend une page d'erreur EN 200 passerait le simple
              # test du code ; Leaflet serait alors rejeté par son empreinte SRI
              # et les cartes disparaîtraient. On exige donc aussi du volume.
              vendor/leaflet/*) if [ "$code" != "200" ] || [ "${size:-0}" -lt 1000 ]; then echo "  ^ LEAFLET NOT OK"; fail=1; fi ;;
              *) if [ "$code" != "200" ]; then echo "  ^ ASSET NOT OK"; fail=1; fi ;;
            esac
          done
          if [ "$fail" = "0" ]; then echo "ALL ASSETS OK"; else echo "ASSET CHECK FAILED"; exit 1; fi
          REMOTE

      # ── PWA CHAUFFEUR (/webshop/driver) ────────────────────────────────
      # Application distincte, déployée à CÔTÉ de la console : elle a sa propre
      # copie du design system et du logo pour que son service worker puisse
      # les mettre en cache — une feuille de route doit rester lisible dans un
      # sous-sol sans réseau, sans dépendre du dossier de la console.
      - name: Assemble driver PWA
        run: |
          rm -rf site-driver && mkdir -p site-driver
          cp -RL driver/. site-driver/
          cp -r _ds img site-driver/
          test -f site-driver/index.html && test -f site-driver/sw.js
          echo "driver payload:"; ls site-driver

      - name: Deploy driver PWA → <parent de DEPLOY_DIR>/driver
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          BO_DIR='${{ vars.DEPLOY_DIR || '/var/www/html/webshop/backoffice_franchisee' }}'
          DRIVER_DIR='${{ vars.DRIVER_DEPLOY_DIR }}'
          [ -n "$DRIVER_DIR" ] || DRIVER_DIR="$(dirname "$BO_DIR")/driver"
          echo "cible : $DRIVER_DIR"
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "mkdir -p '$DRIVER_DIR'"
          sshpass -e rsync -rltDz --omit-dir-times \
            -e "ssh -p ${{ vars.SSH_PORT || '22' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site-driver/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DRIVER_DIR/"

      - name: Verify the driver PWA on the server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s << 'REMOTE'
          BASE="http://localhost/webshop/driver"
          fail=0
          for f in "" index.html app.js api.js app.css sw.js manifest.webmanifest \
                   icon-192.png icon-512.png icon-maskable-512.png shot-1.png shot-2.png vendor/jsqr.js \
                   _ds/l-atelier-by-8504a4e3-7796-44da-b087-3fbd9dcb8dcd/global.css img/logo.png; do
            out=$(curl -s -o /dev/null -w "%{http_code} %{size_download}" "$BASE/$f")
            set -- $out; code=$1; size=$2
            echo "  $code  ${size}b  /webshop/driver/$f"
            if [ "$code" != "200" ]; then echo "  ^ PWA ASSET NOT OK"; fail=1; fi
          done
          # Le service worker doit être servi en JS : servi en text/html (page
          # d'erreur), le navigateur refuse de l'enregistrer et l'app perd
          # l'hors-ligne sans rien dire.
          ct=$(curl -s -o /dev/null -w "%{content_type}" "$BASE/sw.js"); echo "  sw.js content-type : $ct"
          case "$ct" in *javascript*) ;; *) echo "  ^ sw.js n'est pas servi en JavaScript"; fail=1 ;; esac
          if [ "$fail" = "0" ]; then echo "DRIVER PWA OK"; else echo "DRIVER PWA CHECK FAILED"; exit 1; fi
          REMOTE
