# ─────────────────────────────────────────────────────────────────────────────
# Restauration du catalogue depuis le journal bo_audit.
#
# POURQUOI CE WORKFLOW EXISTE. Le 14/08 entre 11h48 et 12h18, la production est
# passée de 89 produits actifs à 6 : des clics sur les bascules de CATÉGORIE de
# la console marque ont cascadé active=0 sur des catégories entières (72
# produits pour Traiteur en un clic). Les écrans étaient justes, la donnée a
# vraiment changé — et chaque écriture est dans bo_audit, avec l'heure et le
# JSON envoyé.
#
# LECTURE SEULE, STRICTEMENT. Ce workflow liste les écritures du journal
# depuis l'heure donnée, nomme les catégories touchées avec leur poids, et
# énumère les produits que ces écritures ont éteints et qui sont toujours en
# brouillon. Il n'écrit JAMAIS rien : la restauration est une décision
# humaine — un clic sur la bascule « Actif » de la catégorie dans la console
# marque refait la cascade inverse, produit par produit si besoin.
# ─────────────────────────────────────────────────────────────────────────────
name: Journal catalogue (bo_audit, lecture seule)

on:
  workflow_dispatch:
    inputs:
      depuis:
        description: "Début de la fenêtre à examiner (heure serveur, format 'YYYY-MM-DD HH:MM:SS')"
        required: true
        type: string
        default: "2026-08-14 11:45:00"

jobs:
  restauration:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Lire le journal, et restaurer si demandé
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ vars.SSH_PORT || 22 }}
          API_BASE: ${{ vars.API_BASE || '/webshop/api' }}
          DEPUIS: ${{ inputs.depuis }}
        run: |
          {
          cat <<'SCRIPT'
          set -u
          API_DIR=""
          for d in "/var/www/html__API_BASE__" /var/www/html/webshop/api /var/www/webshop/api; do
            [ -f "$d/config.php" ] && { API_DIR="$d"; break; }
          done
          [ -z "$API_DIR" ] && { echo "config.php introuvable"; exit 1; }
          eval "$(php -r '
            $c = require $argv[1]; $d = $c["db"];
            foreach (["DBH"=>"host","DBP"=>"port","DBN"=>"name","DBU"=>"user","DBW"=>"pass"] as $k=>$kk)
              printf("%s=%s\n", $k, escapeshellarg((string)$d[$kk]));
          ' "$API_DIR/config.php")"
          export MYSQL_PWD="$DBW"
          dbq() { mysql --host="$DBH" --port="$DBP" --user="$DBU" "$DBN" -N -s -e "$1"; }

          DEPUIS='__DEPUIS__'
          echo "== Journal bo_audit depuis $DEPUIS (heure serveur : $(dbq 'SELECT NOW()')) =="
          dbq "SELECT CONCAT('  ', created_at, '  ', action, '  ', entity, ' #', IFNULL(entity_id,'-'), '  ', IFNULL(payload,''))
                 FROM bo_audit WHERE created_at >= '$DEPUIS'
                  AND action IN ('product.update','category.update','subcategory.update','catalogue.restauration')
                ORDER BY id LIMIT 400"
          echo ""
          echo "== Les catégories touchées, et leur poids =="
          dbq "SELECT CONCAT('  #', c.id, '  ', c.label, '  — ', COUNT(p.id), ' produit(s), dont ', SUM(p.active=1), ' actif(s)')
                 FROM ws_categories c LEFT JOIN ws_products p ON p.cat_id = c.id
                WHERE c.id IN (SELECT DISTINCT entity_id FROM bo_audit
                                WHERE created_at >= '$DEPUIS' AND action='category.update')
                GROUP BY c.id, c.label"

          # UNE SEULE SESSION MYSQL pour toute l'analyse : une table temporaire
          # meurt avec sa connexion, et dbq en ouvre une par appel — la première
          # version a échoué exactement là-dessus (Table t_evt doesn't exist).
          mysql --host="$DBH" --port="$DBP" --user="$DBU" "$DBN" -N -s <<'SQL'
          CREATE TEMPORARY TABLE t_evt AS
          SELECT p.id AS pid, a.id AS aid,
                 CAST(JSON_EXTRACT(a.payload,'$.active') AS UNSIGNED) AS actif
            FROM bo_audit a
            JOIN ws_products p ON (
                   (a.action='product.update'     AND a.entity_id = p.id)
                OR (a.action='category.update'    AND a.entity_id = p.cat_id)
                OR (a.action='subcategory.update' AND a.entity_id = p.sub_cat_id))
           WHERE a.created_at >= '__DEPUIS__'
             AND a.action IN ('product.update','category.update','subcategory.update')
             AND JSON_EXTRACT(a.payload,'$.active') IS NOT NULL;

          -- DEUX tables : MariaDB refuse d'ouvrir deux fois la même TEMPORARY
          -- dans une requête (« Can't reopen table »), et la dérivée sur t_evt
          -- comptait comme une seconde ouverture.
          CREATE TEMPORARY TABLE t_last AS
          SELECT pid, MAX(aid) aid FROM t_evt GROUP BY pid;

          SELECT '';
          SELECT CONCAT('== ', COUNT(*), ' produit(s) éteints par ces écritures et toujours en brouillon ==')
            FROM t_evt e
            JOIN t_last d ON d.pid = e.pid AND d.aid = e.aid
            JOIN ws_products p2 ON p2.id = e.pid
           WHERE e.actif = 0 AND p2.active = 0;
          SELECT CONCAT('  · ', p2.name) FROM t_evt e
            JOIN t_last d ON d.pid = e.pid AND d.aid = e.aid
            JOIN ws_products p2 ON p2.id = e.pid
           WHERE e.actif = 0 AND p2.active = 0 ORDER BY p2.name LIMIT 120;
          SQL

          echo ""
          echo "== QUI ÉCRIT ws_products SANS PASSER PAR LE JOURNAL ? =="
          # Le journal n'explique pas l'extinction de masse du 14/08 : les trois
          # seules routes d'écriture de l'API sont auditées. On cherche donc le
          # canal FANTÔME, côté serveur : crons et scripts hors dépôt.
          echo "  -- crontab de l'utilisateur --"
          crontab -l 2>/dev/null | sed 's/^/    /' || echo "    (vide ou illisible)"
          echo "  -- crons système (fichiers) --"
          ls /etc/cron.d/ 2>/dev/null | sed 's/^/    /'
          grep -RIl "ws_products" /etc/cron.d/ /etc/cron.hourly/ /etc/cron.daily/ 2>/dev/null | sed 's/^/    ⚠ /'
          echo "  -- scripts serveur (hors API du dépôt) qui touchent ws_products --"
          grep -RIl --include='*.php' --include='*.sh' --include='*.py' "ws_products" \
               /var/www 2>/dev/null | grep -v "/webshop/api/" | head -20 | sed 's/^/    ⚠ /'
          echo "  -- heure de dernière écriture de la table (approximation moteur) --"
          dbq "SELECT CONCAT('    UPDATE_TIME ws_products : ', IFNULL(UPDATE_TIME,'(non suivi)'))
                 FROM information_schema.tables
                WHERE table_schema=DATABASE() AND table_name='ws_products'"
          echo ""
          echo "== État actuel, par catégorie =="
          dbq "SELECT CONCAT('    ', IF(c.active,'active  ','INACTIVE'), '  ',
                      LPAD(IFNULL(SUM(p4.active=1),0),3,' '), ' actifs / ', COUNT(p4.id), '  ', c.label)
                 FROM ws_categories c LEFT JOIN ws_products p4 ON p4.cat_id = c.id
                GROUP BY c.id, c.label, c.active ORDER BY c.label LIMIT 30"
          echo "(lecture seule — ce workflow n'écrit jamais rien)"
          SCRIPT
          } | sed -e "s|__API_BASE__|${API_BASE}|" -e "s|__DEPUIS__|${DEPUIS}|" \
            | sshpass -e ssh -p "${SSH_PORT}" \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s
