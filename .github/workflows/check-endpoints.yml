name: Vérifier les endpoints /franchisee/*

# Diagnostic en LECTURE SEULE : depuis le serveur (en localhost, donc sans
# exposer l'hôte), interroge chaque endpoint que la console appelle et publie
# son code HTTP. Rien n'est écrit, aucun POST n'est émis.
#
# Depuis la suppression du seed, un écran vide = un endpoint qui ne répond pas.
# Ce workflow dit lequel, et sépare les deux causes qui n'ont pas le même
# remède :
#   404       → la route n'existe pas côté PHP : la table restera vide tant
#               qu'elle n'est pas écrite
#   401 / 403 → la route existe et exige le jeton admin : comportement normal
#   200       → la route répond ; avec un jeton, le rapport indique aussi le
#               nombre de lignes, donc si la table est vide côté base
#
# Il contrôle AUSSI l'état réel de la base — triggers, colonnes de migration, et
# les deux conséquences qui se voient à l'écran (clients sans boutique, boutiques
# sans position). Motif : une migration enregistrée ne prouve pas que son objet
# est encore là. Les triggers trg_client_office_delivery_* figuraient dans
# ws_schema_migrations tout en ayant disparu de la base — un DROP TABLE emporte
# les triggers, pas les lignes du journal des migrations — et rien ne le disait.
# Ce contrôle reste en LECTURE SEULE : information_schema et des COUNT(*).
# Aucun identifiant de connexion n'est imprimé.
#
# Lancement : onglet Actions → ce workflow → « Run workflow ».
#
# Secrets :  SSH_HOST · SSH_USER · SSH_PASSWORD  (les mêmes que le déploiement)
#            ADMIN_TOKEN — FACULTATIF. S'il est défini, les appels portent
#            l'en-tête X-Admin-Token et le rapport compte les lignes renvoyées.
#            Il est transmis par l'entrée standard de SSH, jamais sur la ligne
#            de commande distante (il n'apparaît donc pas dans les processus du
#            serveur). Sans lui, le rapport s'arrête aux codes HTTP — ce qui
#            suffit déjà à repérer les routes manquantes.
# Vars :     SSH_PORT (défaut 22) · API_BASE (défaut /webshop/api)
#            SHOP_ID — facultatif : force la boutique sondée (Variables OU
#            Secrets). Le champ « shop » saisi au lancement prime sur elle ;
#            sans ni l'un ni l'autre, la portée est cherchée via /franchisee/me.

on:
  workflow_dispatch:
    inputs:
      shop:
        description: "Portée boutique — ID NUMÉRIQUE (celui de ?shop=… dans l'URL de la console). Laisser vide pour tenter la détection."
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Écrire la sonde
        run: |
          cat > probe.sh << 'PROBE'
          set -u
          BASE="http://localhost${API_BASE}"
          if [ -n "${ADMIN_TOKEN:-}" ]; then
            HDR=(-H "X-Admin-Token: ${ADMIN_TOKEN}"); AUTH="avec jeton admin"
          else
            HDR=(); AUTH="SANS jeton admin — 401/403 signifie « route en place »"
          fi
          echo "Base API : $BASE   ·   $AUTH"

          # PORTÉE BOUTIQUE. La console passe ?shop=<id> sur TOUS ses appels, et
          # certains endpoints n'ont pas de sens sans elle — ws-payment-methods
          # renvoie [] si la portée manque. Sonder sans portée ferait donc passer
          # une boutique correctement configurée pour une base vide. On résout
          # l'id une fois via /franchisee/me, comme le fait le boot de l'app.
          # Ordre : saisie au lancement, puis variable/secret du dépôt, puis
          # détection. Le champ de lancement ne peut pas être mal rangé.
          SHOP="${SHOP_INPUT:-}"
          if [ -n "$SHOP" ]; then echo "  portée saisie au lancement"
          elif [ -n "${SHOP_ID:-}" ]; then SHOP="$SHOP_ID"; echo "  portée fournie par SHOP_ID"
          else echo "  aucune portée fournie (champ de lancement vide, SHOP_ID absente des Variables et des Secrets)"; fi
          if [ -z "$SHOP" ]; then
            ME=$(curl -s --max-time 12 "${HDR[@]}" "$BASE/franchisee/me" 2>/dev/null)
            MEC=$(printf '%s' "$ME" | tr -d ' \n')   # compacté : UNIQUEMENT pour les ids numériques
            # Plusieurs formes possibles selon la version du PHP ; on les essaie
            # dans l'ordre du plus explicite au plus permissif.
            # 1. shop objet avec id · 2. shop_id · 3. id de tête.
            # PLUS DE SLUG : l'API n'accepte qu'un id numérique en ?shop=. Une
            # sonde qui résoudrait encore un slug le verrait refusé et rendrait
            # un rapport « tout vide » sur une base pourtant saine.
            SHOP=$(printf '%s' "$MEC" | grep -o '"shop":{[^}]*}' | grep -o '"id":"\?[0-9]\+' | grep -o '[0-9]\+' | head -1)
            [ -z "$SHOP" ] && SHOP=$(printf '%s' "$MEC" | grep -o '"shop_id":"\?[0-9]\+' | grep -o '[0-9]\+' | head -1)
            [ -z "$SHOP" ] && SHOP=$(printf '%s' "$MEC" | grep -o '"id":"\?[0-9]\+' | grep -o '[0-9]\+' | head -1)
            # Tout ce qui n'est pas un id est écarté : mieux vaut annoncer
            # l'absence de portée que sonder une portée que l'API refusera.
            if [ -n "$SHOP" ] && printf '%s' "$SHOP" | grep -qv '^[0-9]\{1,\}$'; then
              echo "  portée « $SHOP » n'est pas un id numérique — posez la variable SHOP_ID"; SHOP=''
            fi
            # Motif fourni par le serveur quand il refuse la portée (shopReason).
            if [ -z "$SHOP" ]; then
              WHY=$(printf '%s' "$ME" | grep -o '"shopReason":"[^"]*"' | head -1 | sed 's/^"shopReason":"//;s/"$//')
              [ -n "$WHY" ] && echo "  /franchisee/me — motif : $WHY"
            fi
            # Diagnostic sans fuite : NOMS de champs, et TYPE du champ shop —
            # jamais sa valeur (le dépôt et ses journaux sont publics).
            if [ -z "$SHOP" ]; then
              echo "  /franchisee/me — champs vus : $(printf '%s' "$ME" | grep -o '"[a-zA-Z_]\{1,\}":' | tr -d '\":' | sort -u | tr '\n' ' ')"
              RAW=$(printf '%s' "$MEC" | grep -o '"shop":[^,}]*' | head -1 | sed 's/^"shop"://')
              case "$RAW" in
                null)  echo "  /franchisee/me — shop = null : ce jeton n'est rattaché à AUCUNE boutique (portée réseau)" ;;
                '""')  echo "  /franchisee/me — shop = chaîne vide" ;;
                '')    echo "  /franchisee/me — champ shop introuvable" ;;
                \"*)   echo "  /franchisee/me — shop = chaîne de $(printf '%s' "$RAW" | wc -c | tr -d ' ') caractères, non réduite à un slug simple" ;;
                *)     echo "  /franchisee/me — shop = valeur non textuelle" ;;
              esac
            fi
          fi
          # Dernier recours : demander au serveur les boutiques qu'il connaît.
          # /franchisee/geo-clients porte un tableau shops[] avec leurs ids. On
          # n'imprime que les IDS — le dépôt et ses journaux sont publics.
          if [ -z "$SHOP" ]; then
            GC=$(curl -s --max-time 15 "${HDR[@]}" "$BASE/franchisee/geo-clients" 2>/dev/null | tr -d ' \n')
            IDS=$(printf '%s' "$GC" | grep -o '"shops":\[.*' | grep -o '"id":"\?[0-9]\{1,\}' | grep -o '[0-9]\{1,\}' | sort -un | tr '\n' ' ')
            if [ -n "$IDS" ]; then
              echo "  boutiques connues du serveur (ids) : $IDS"
              SHOP=$(printf '%s' "$IDS" | awk '{print $1}')
              echo "  aucune portée fournie → sonde avec la première : $SHOP"
              echo "  (pour en sonder une autre, relancer en saisissant son id dans le champ « shop »)"
            fi
          fi
          if [ -n "$SHOP" ]; then QS="?shop=$SHOP"; echo "Portée    : boutique $SHOP"
          else QS=''; echo "Portée    : AUCUNE — /franchisee/me n'a pas rendu d'id ; les endpoints qui exigent la portée renverront [] à tort"; fi
          echo

          # Les 50 tables hydratées au démarrage de la console.
          TABLES="b2b-clients b2b-departments catchment-postcodes drivers 
          erp-portion-rules fr-alertes fr-assortiment fr-capacity fr-clients 
          fr-cout-params fr-dispo-cats fr-incidents fr-join-requests 
          fr-live-drivers fr-live-eta fr-live-table fr-net-stats fr-orders 
          fr-prep-lines fr-prep-points fr-renta-evolution fr-renta-kpis 
          fr-rentabilite fr-shop-availability fr-stock-catalog 
          fr-tdb-tournees fr-tdb-tree fr-validations fr-vouchers params 
          tour-dispatch-status users ws-calendar-rules ws-delivery-fee-rules 
          ws-delivery-zones ws-franchisor-catchment 
          ws-office-delivery-settings ws-office-delivery-sites 
          ws-office-emails ws-offices ws-payment-methods 
          ws-pricing-rules-local ws-product-availability ws-shop-exceptions 
          ws-slots ws-tour-availability ws-tour-closures ws-tour-postcodes 
          ws-tours ws-vouchers-local"

          # Appelés directement par les écrans, hors hydratation.
          DIRECT="me geo-clients bo-store zone-check client-orders stock-product-orders stock-threshold-info fr-voucher-targets"

          # ROUTES DÉCLARÉES NON ÉCRITES. bo_server.js les liste dans
          # ROUTES_A_ECRIRE pour que leur 404 n'alimente pas le bandeau d'erreur
          # de la console. Le rapport doit suivre la MÊME règle, et lire la même
          # source : recopier la liste ici, c'est la voir diverger. Leur 404 est
          # un chantier connu, pas une anomalie — les compter ferait afficher
          # « Anomalies : 2 » en permanence, et un compteur toujours rouge cesse
          # d'être lu. Les clés sont des noms de table (fr_renta_evolution) ;
          # les routes portent des tirets.
          ATTENDUS=$(curl -s --max-time 12 "http://localhost/webshop/backoffice_franchisee/bo_server.js" 2>/dev/null \
            | grep -o 'ROUTES_A_ECRIRE[^;]*' | head -1 | grep -o '[A-Za-z_][A-Za-z0-9_]*[[:space:]]*:[[:space:]]*1' \
            | sed 's/[[:space:]]*:.*//; s/_/-/g' | tr '\n' ' ')
          if [ -n "$ATTENDUS" ]; then echo "Chantiers déclarés (404 attendu) : $ATTENDUS"
          else echo "Chantiers déclarés : liste non lue dans bo_server.js — tout 404 sera compté"; fi
          echo

          missing=0    # 404 IMPRÉVUS
          known=0      # 404 sur une route déclarée non écrite
          dbko=0       # objets de base attendus et absents
          probe() {                      # $1 = URL   $2 = libellé
            out=$(curl -s --max-time 12 "${HDR[@]}" -w '\n%{http_code}' "$1" 2>/dev/null)
            code=$(printf '%s' "$out" | tail -n1)
            payload=$(printf '%s' "$out" | sed '$d')
            note=''
            case "$code" in
              200)
                head2=$(printf '%s' "$payload" | tr -d ' \n' | head -c2)
                if [ "$head2" = "[]" ]; then note='0 ligne'
                elif [ "${head2#[}" != "$head2" ]; then
                  n=$(printf '%s' "$payload" | grep -o '}[[:space:]]*,[[:space:]]*{' | wc -l | tr -d ' ')
                  note="$((n+1)) ligne(s)"
                else note='objet'; fi ;;
              404)
                case " $ATTENDUS " in
                  *" $2 "*) note='chantier déclaré'; known=$((known+1)) ;;
                  *)        note='ROUTE ABSENTE';    missing=$((missing+1)) ;;
                esac ;;
              401|403) note='auth requise' ;;
              000)     note='pas de réponse' ;;
              *)       note='—' ;;
            esac
            printf '  %-3s  %-14s  %s\n' "$code" "$note" "$2"
          }

          echo "== Tables hydratées au démarrage =="
          for t in $TABLES; do probe "$BASE/franchisee/$t$QS" "$t"; done
          echo
          echo "== Appelés par les écrans =="
          for t in $DIRECT; do probe "$BASE/franchisee/$t$QS" "$t"; done
          echo
          echo "== Référentiel postal (cartes, zones, analyse géo) =="
          probe "$BASE/geo/postcodes?all=1"    "geo/postcodes?all=1"
          probe "$BASE/geo/postcodes?groups=1" "geo/postcodes?groups=1"
          echo
          echo "== Page servie (ce que le navigateur reçoit vraiment) =="
          PAGE="http://localhost/webshop/backoffice_franchisee/"
          HTML=$(curl -s --max-time 15 "$PAGE" 2>/dev/null)
          echo "  octets reçus : $(printf '%s' "$HTML" | wc -c | tr -d ' ')"
          # Marqueurs : chacun n'apparaît que si le déploiement porte bien la
          # version correspondante. Absent ⇒ le serveur n'a pas le dernier code ;
          # présent alors que l'écran manque à l'écran ⇒ cache du navigateur.
          for probe in "Avis clients:écran Avis" "REVIEWS_PATH:appel des avis" "langList:sélecteur de langue" "searchDefs:recherche du menu" "assign():constructeur de tournées"; do
            needle=${probe%%:*}; label=${probe#*:}
            if printf '%s' "$HTML" | grep -qF -- "$needle"; then echo "  présent  $label"
            else echo "  ABSENT   $label"; fi
          done
          echo "  en-têtes de cache :"
          curl -sI --max-time 15 "$PAGE" | grep -i '^\(cache-control\|etag\|last-modified\|expires\)' | sed 's/^/    /'
          echo

          # ── POSITION DE LA BOUTIQUE SONDÉE ────────────────────────────────
          # Le pin de « Livraison du jour » et de « Tournées » se déduit
          # entièrement de trois champs de /franchisee/me : lat, lng, geoSource.
          # Tous les tracés partent de ce point et les ETA en découlent, donc
          # une position approximative n'est pas un détail d'affichage. On dit
          # ici CE QUE LA CONSOLE AFFICHERA, sans imprimer les coordonnées ni
          # l'adresse : le dépôt et ses journaux sont publics.
          if [ -n "$SHOP" ]; then
            echo "== Position de la boutique $SHOP (ce que le pin affichera) =="
            MEP=$(curl -s --max-time 12 "${HDR[@]}" "$BASE/franchisee/me$QS" 2>/dev/null)
            SRC=$(printf '%s' "$MEP" | grep -o '"geoSource":"[^"]*"' | head -1 | sed 's/.*:"//;s/"$//')
            HASLL=$(printf '%s' "$MEP" | tr -d ' \n' | grep -c '"lat":[0-9-]')
            case "$SRC" in
              address|manual)
                echo "  OK       position EXACTE (geoSource=$SRC) — pin sur l'adresse, aucun bandeau" ;;
              zip)
                echo "  ⚠ APPROX position = centre du code postal (geoSource=zip) — le pin et les"
                echo "           tracés sont décalés, la console affiche l'avertissement." ;;
              failed|'')
                if [ "$HASLL" = "1" ]; then
                  echo "  ⚠ position présente mais SANS source déclarée — vérifier shops.geo_source"
                else
                  echo "  ⚠ AUCUNE position servie — aucun pin, et un bandeau sur les cartes."
                  W=$(printf '%s' "$MEP" | grep -o '"geoReason":"[^"]*"' | head -1 | sed 's/.*:"//;s/"$//')
                  [ -n "$W" ] && echo "           Cause donnée par le serveur : $W"
                  echo "           Remède : corriger l'adresse, puis POST /franchisee/shop-geocode."
                fi ;;
              *) echo "  geoSource inattendu : $SRC" ;;
            esac
            # L'adresse doit être servie : le pin l'affiche sous le nom.
            if printf '%s' "$MEP" | grep -q '"address":"[^"]'; then echo "  OK       adresse servie au pin"
            else echo "  ⚠ adresse absente de /franchisee/me — le pin n'affichera que le nom"; fi
            echo
          fi

          # ── CE QUI S'AFFICHERA « — » ──────────────────────────────────────
          # La console n'invente plus aucune valeur : une donnée que le serveur
          # ne sert pas s'affiche « — », et les calculs qui en dépendent ne sont
          # pas publiés. C'est volontaire — mais il vaut mieux le savoir AVANT
          # d'ouvrir l'écran que devant une colonne vide. Cette section dit donc
          # quelles données manquent, et ce que l'écran fera en conséquence.
          # Lecture seule, et AUCUNE valeur n'est imprimée : seulement
          # « renseigné » ou « absent ».
          echo "== Ce que les écrans afficheront « — » =="

          # 1. Coûts (écran Rentabilité). Les quatre sont nécessaires : sans eux
          #    la cascade de marge cède la place à son explication.
          PRM=$(curl -s --max-time 12 "${HDR[@]}" "$BASE/franchisee/params$QS" 2>/dev/null)
          # Quelles clés de coût la base porte-t-elle RÉELLEMENT ? L'écran Coûts
          # et le calcul de marge en ont longtemps employé deux jeux différents
          # (cost_prep_hourly… d'un côté, cost_prep… de l'autre) : on liste les
          # NOMS trouvés, sans leurs valeurs, pour aligner le code sur la base.
          VUS=$(printf '%s' "$PRM" | tr -d ' ' | grep -o '"cle":"cost_[a-z_]*"' | sed 's/.*:"//;s/"$//' | sort -u | tr '\n' ' ')
          echo "  clés de coût présentes en base : ${VUS:-aucune}"
          MANQ=''
          for K in cost_prep cost_emb cost_charg cost_struct; do
            if printf '%s' "$PRM" | tr -d ' ' | grep -q "\"cle\":\"$K\""; then :; else MANQ="$MANQ $K"; fi
          done
          if [ -z "$MANQ" ]; then
            echo "  OK       coûts paramétrés — la cascade de marge se calcule"
          else
            echo "  ⚠ coûts ABSENTS de ws_param :$MANQ"
            echo "           ⇒ écran Rentabilité : « Coûts non paramétrés », pas de cascade"
            echo "           ⇒ marge par point non calculée (elle valait CA − 0 auparavant)"
          fi

          # 2. Heure de départ par tournée (ws_tour_availability.dep). Le premier
          #    trajet part de la boutique à cette heure : sans elle, la tournée
          #    n'a plus d'ETA du tout.
          TRJ=$(curl -s --max-time 12 "${HDR[@]}" "$BASE/franchisee/ws-tours$QS" 2>/dev/null)
          AVJ=$(curl -s --max-time 12 "${HDR[@]}" "$BASE/franchisee/ws-tour-availability$QS" 2>/dev/null)
          NOMS=$(printf '%s' "$TRJ" | sed 's/},{/}\n{/g' | grep -o '"name":"[^"]*"' | sed 's/.*:"//;s/"$//' | sort -u)
          # Une ligne de disponibilité ne compte que si son `dep` est renseigné.
          AVEC=$(printf '%s' "$AVJ" | sed 's/},{/}\n{/g' | grep '"dep":"[0-9]' | grep -o '"tour":"[^"]*"' | sed 's/.*:"//;s/"$//' | sort -u)
          SANS=$(comm -23 <(printf '%s\n' "$NOMS" | grep -v '^$') <(printf '%s\n' "$AVEC" | grep -v '^$') 2>/dev/null)
          if [ -z "$SANS" ]; then
            echo "  OK       toutes les tournées ont une heure de départ"
          else
            echo "  ⚠ tournées SANS heure de départ (ws_tour_availability.dep) :"
            printf '%s\n' "$SANS" | sed 's/^/             · /'
            echo "           ⇒ aucune ETA publiée pour elles (08:00 était supposé auparavant)"
          fi

          # 3. Temps d'accès et de dépôt des sites. Ils entrent dans chaque heure
          #    d'arrivée : il en manque un et la tournée entière perd ses heures.
          # Le temps d'ACCÈS est sur le site ; le temps de DÉPÔT est par BUREAU,
          # dans ws_office_delivery_settings. Les chercher au même endroit
          # revenait à n'en trouver qu'un.
          STJ=$(curl -s --max-time 12 "${HDR[@]}" "$BASE/franchisee/ws-office-delivery-sites$QS" 2>/dev/null)
          LIG=$(printf '%s' "$STJ" | sed 's/},{/}\n{/g' | grep -c '"adr"' || true)
          ACC=$(printf '%s' "$STJ" | sed 's/},{/}\n{/g' | grep -c '"acc":"\?[0-9]' || true)
          if [ "$LIG" -gt 0 ] && [ "$ACC" -ge "$LIG" ]; then
            echo "  OK       les $LIG site(s) ont un temps d'accès"
          else
            echo "  ⚠ sites : $ACC/$LIG avec temps d'accès (ws_office_delivery_sites.acc)"
            echo "           ⇒ heures d'arrivée « — » pour les tournées concernées"
          fi
          DSJ=$(curl -s --max-time 12 "${HDR[@]}" "$BASE/franchisee/ws-office-delivery-settings$QS" 2>/dev/null)
          DLI=$(printf '%s' "$DSJ" | sed 's/},{/}\n{/g' | grep -c '"bureau"' || true)
          DRP=$(printf '%s' "$DSJ" | sed 's/},{/}\n{/g' | grep -c '"drop":"\?[0-9]' || true)
          if [ "$DLI" -gt 0 ] && [ "$DRP" -ge "$DLI" ]; then
            echo "  OK       les $DLI bureau(x) ont un temps de dépôt"
          else
            echo "  ⚠ bureaux : $DRP/$DLI avec temps de dépôt (ws_office_delivery_settings.drop)"
            echo "           ⇒ heures d'arrivée « — » pour les tournées concernées"
            echo "             (5 min par bureau étaient supposées auparavant)"
          fi
          echo

          # ── LIEN MAGIQUE « CRÉER MON COMPTE » ──────────────────────────────
          # Un bureau reçoit UN lien et le transfère à son personnel. Trois
          # pièces doivent être en place, et chacune casse le parcours seule :
          #   • la PAGE d'arrivée, servie à /webshop/inscription (règle de
          #     réécriture) — sans elle, le lien du mail tombe sur un 404 ;
          #   • l'endpoint de PRÉ-REMPLISSAGE, qui doit REFUSER un jeton bidon
          #     avec un motif : accepter un jeton invalide créerait un compte
          #     rattaché à rien, et un 500 muet ne se diagnostique pas ;
          #   • la TABLE ws_office_invites (migration 0062) — sans elle, aucun
          #     lien n'est émis, et la création du bureau le dit sans échouer.
          echo "== Lien magique « Créer mon compte » =="
          for U in "http://localhost/webshop/inscription" "http://localhost/webshop/inscription.html"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 12 "$U" 2>/dev/null)
            case "$CODE" in
              200) echo "  OK       page servie ($U)";;
              404) echo "  ABSENT   $U — HTTP 404";;
              *)   echo "  ⚠ $U — HTTP $CODE";;
            esac
          done
          INV=$(curl -s --max-time 12 -w '\n%{http_code}' "$BASE/inscription?i=jeton-de-test-invalide" 2>/dev/null)
          INVC=$(printf '%s' "$INV" | tail -1)
          if printf '%s' "$INV" | grep -q '"ok":false'; then
            echo "  OK       jeton invalide refusé avec un motif (HTTP $INVC)"
          else
            echo "  ⚠ /inscription : HTTP $INVC sans refus explicite"
            echo "           ⇒ la page ne pourra pas dire au collaborateur pourquoi son lien ne marche pas"
          fi

          # ── OBJETS DE BASE ────────────────────────────────────────────────
          # Une migration enregistrée ne prouve PAS que son objet est encore là.
          # Les triggers trg_client_office_delivery_ai/_au (0019/0021/0023) sont
          # enregistrés comme appliqués et ABSENTS de la base : quelque chose les
          # a effacés après coup — reconstruction de table, restauration, ou
          # changement de base. Un DROP TABLE emporte les triggers, pas les
          # lignes de ws_schema_migrations, et rien ne le signalait.
          # Ce qui les a effacés effacera les suivants. On regarde donc l'ÉTAT
          # RÉEL, pas le journal des migrations. Lecture seule : information_schema
          # et deux COUNT(*). Aucun identifiant n'est imprimé.
          echo "== Objets de base attendus (lecture seule) =="
          API_DIR=""
          for d in "/var/www/html${API_BASE}" /var/www/html/webshop/api /var/www/webshop/api; do
            [ -f "$d/config.php" ] && { API_DIR="$d"; break; }
          done
          if [ -z "$API_DIR" ]; then
            echo "  config.php introuvable — contrôle base ignoré (les endpoints ci-dessus restent valables)"
          elif ! command -v mysql >/dev/null 2>&1; then
            echo "  client mysql absent du serveur — contrôle base ignoré"
          else
            # Mêmes identifiants que l'API et que migrate.sh : aucun secret
            # supplémentaire, et le mot de passe passe par MYSQL_PWD (jamais
            # sur la ligne de commande, donc invisible dans les processus).
            eval "$(php -r '
              $c = require $argv[1]; $d = $c["db"];
              foreach (["DBH"=>"host","DBP"=>"port","DBN"=>"name","DBU"=>"user","DBW"=>"pass"] as $k=>$kk)
                printf("%s=%s\n", $k, escapeshellarg((string)$d[$kk]));
            ' "$API_DIR/config.php" 2>/dev/null)"
            export MYSQL_PWD="${DBW:-}"
            dbq() { mysql --host="${DBH:-localhost}" --port="${DBP:-3306}" --user="${DBU:-}" "${DBN:-}" -N -s -e "$1" 2>/dev/null; }

            if [ -z "$(dbq 'SELECT 1')" ]; then
              echo "  connexion base impossible avec les identifiants de l'API — contrôle ignoré"
            else
              # 1. Triggers RÉELLEMENT présents sur `client`.
              TRG=$(dbq "SELECT TRIGGER_NAME FROM information_schema.triggers
                          WHERE EVENT_OBJECT_SCHEMA = DATABASE() AND EVENT_OBJECT_TABLE = 'client'" | tr '\n' ' ')
              echo "  triggers sur client : ${TRG:-aucun}"
              # ATTENDU : uniquement celui de la migration 0061. Les triggers
              # office_delivery ne sont PAS attendus — le PHP crée désormais le
              # bureau lui-même sur les quatre routes concernées. Les réclamer
              # ici produirait une alerte permanente, et une alerte permanente
              # n'est plus lue.
              case " $TRG " in
                *" trg_client_preferred_shop_bi "*)
                  echo "  OK       trg_client_preferred_shop_bi (0061) en place" ;;
                *)
                  echo "  ⚠ ABSENT trg_client_preferred_shop_bi — la migration 0061 est enregistrée mais son"
                  echo "           trigger a disparu : la table client a été reconstruite ou restaurée."
                  echo "           Remède : rejouer son bloc CREATE TRIGGER (0061 ne se rejouera pas seule)."
                  dbko=$((dbko+1)) ;;
              esac

              # 2. Colonnes posées par les migrations, vérifiées sur le schéma.
              # ws_office_invites.depts : la charge du jeton d'invitation est
              # refabriquée depuis la ligne quand la console réaffiche le lien.
              # Colonne absente ⇒ le lien reconstitué diffère de celui envoyé
              # par e-mail, et le collaborateur tombe sur « lien invalide ».
              for cc in "shops:lat:0060" "shops:lng:0060" "client:preferred_shop_id:—" "shops:geo_source:0060" \
                        "ws_office_invites:jti:0062" "ws_office_invites:depts:0062"; do
                t=${cc%%:*}; rest=${cc#*:}; c=${rest%%:*}; mig=${rest#*:}
                n=$(dbq "SELECT COUNT(*) FROM information_schema.columns
                          WHERE table_schema = DATABASE() AND table_name = '$t' AND column_name = '$c'")
                if [ "${n:-0}" = "1" ]; then printf '  OK       %s.%s\n' "$t" "$c"
                else printf '  ⚠ ABSENT %s.%s (migration %s non appliquée sur CETTE base)\n' "$t" "$c" "$mig"
                     dbko=$((dbko+1)); fi
              done

              # 3. La conséquence VISIBLE, pas seulement la structure : un client
              #    sans preferred_shop_id n'apparaît dans aucune console et n'est
              #    plus modifiable. C'est la sentinelle qui compte.
              ORPH=$(dbq "SELECT COUNT(*) FROM client
                           WHERE active = 1 AND preferred_shop_id IS NULL")
              if [ -z "$ORPH" ]; then echo "  —        clients sans boutique : non mesurable (colonne absente)"
              elif [ "$ORPH" = "0" ]; then echo "  OK       clients actifs sans boutique : 0"
              else echo "  ⚠ $ORPH client(s) actif(s) sans preferred_shop_id — invisibles dans toutes les consoles."
                   echo "           Remède : rejouer le bloc UPDATE de la migration 0061."
                   dbko=$((dbko+1)); fi

              # 4. Boutiques sans position : les tournées partent de ce point.
              GEO=$(dbq "SELECT COUNT(*) FROM shops WHERE active = 1 AND (lat IS NULL OR lng IS NULL)")
              if [ -n "$GEO" ] && [ "$GEO" != "0" ]; then
                echo "  ⚠ $GEO boutique(s) active(s) sans position — le pin et les tracés retombent sur un repli."
                echo "           Remède : ouvrir la console, ou POST /franchisee/shop-geocode."
              elif [ -n "$GEO" ]; then echo "  OK       toutes les boutiques actives ont une position"; fi

              # 5. RATTACHEMENT DES SITES — le entonnoir que vit le client.
              #    Le webshop propose au client des POINTS de livraison
              #    (ws_office_delivery_sites). Lier un point n'active la livraison
              #    que s'il pointe vers une SOCIÉTÉ (office_client_id) validée ET
              #    rattachée à une tournée : c'est la chaîne que suit
              #    user_payload(). Un maillon manquant et le client choisit un
              #    bureau sans effet, puis se voit refuser la livraison.
              #    Ces compteurs disent COMBIEN de sites sont dans chaque état,
              #    donc combien il reste à traiter dans Clients B2B › Sites.
              SC=""; [ -n "$SHOP" ] && SC=" AND sd.shop_id = $SHOP"
              TOT=$(dbq "SELECT COUNT(*) FROM ws_office_delivery_sites sd
                          WHERE sd.active = 1$SC")
              if [ -z "$TOT" ]; then
                echo "  —        sites de livraison : table absente ou illisible"
              elif [ "$TOT" = "0" ]; then
                echo "  —        aucun site de livraison actif pour cette portée"
              else
                ORPH_S=$(dbq "SELECT COUNT(*) FROM ws_office_delivery_sites sd
                               WHERE sd.active = 1$SC
                                 AND (sd.office_client_id IS NULL OR sd.office_client_id = 0)")
                PENDING=$(dbq "SELECT COUNT(*) FROM ws_office_delivery_sites sd
                                 JOIN ws_offices o ON o.id = sd.office_client_id AND o.active = 1
                                WHERE sd.active = 1$SC AND o.status <> 'validated'")
                NOTOUR=$(dbq "SELECT COUNT(*) FROM ws_office_delivery_sites sd
                                JOIN ws_offices o ON o.id = sd.office_client_id AND o.active = 1
                               WHERE sd.active = 1$SC AND o.status = 'validated'
                                 AND (o.tour_id IS NULL OR o.tour_id = 0)")
                OK_S=$(dbq "SELECT COUNT(*) FROM ws_office_delivery_sites sd
                              JOIN ws_offices o ON o.id = sd.office_client_id AND o.active = 1
                             WHERE sd.active = 1$SC AND o.status = 'validated'
                               AND o.tour_id IS NOT NULL AND o.tour_id > 0")
                echo "  sites de livraison actifs : $TOT"
                printf '    %-4s livrables (societe validee + tournee)\n' "${OK_S:-0}"
                if [ "${ORPH_S:-0}" != "0" ]; then
                  echo "    ⚠ ${ORPH_S} SANS societe rattachee — le client peut les choisir sans effet."
                  echo "      Remede : Clients B2B › Sites, rattacher chaque site a sa societe."
                  dbq "SELECT CONCAT('        · ', sd.name) FROM ws_office_delivery_sites sd
                        WHERE sd.active = 1$SC
                          AND (sd.office_client_id IS NULL OR sd.office_client_id = 0)
                        ORDER BY sd.name LIMIT 15"
                  [ "${ORPH_S:-0}" -gt 15 ] 2>/dev/null && echo "        … et $((ORPH_S - 15)) autre(s)"
                  dbko=$((dbko+1))
                fi
                [ "${PENDING:-0}" != "0" ] && echo "    ⚠ ${PENDING} sur une societe NON VALIDEE — a valider dans Clients B2B › Bureaux."
                [ "${NOTOUR:-0}"  != "0" ] && echo "    ⚠ ${NOTOUR} sur une societe SANS TOURNEE — a rattacher dans Tournees."
              fi

              # 6. Migrations présentes sur le disque mais jamais enregistrées.
              if [ -d "$API_DIR/migrations" ]; then
                PEND=''
                for f in "$API_DIR"/migrations/*.sql; do
                  [ -e "$f" ] || continue
                  v=$(basename "$f")
                  [ -z "$(dbq "SELECT 1 FROM ws_schema_migrations WHERE version = '$v' LIMIT 1")" ] && PEND="$PEND $v"
                done
                if [ -n "$PEND" ]; then echo "  ⚠ migrations non appliquées :$PEND"; dbko=$((dbko+1))
                else echo "  OK       toutes les migrations du serveur sont enregistrées"; fi
              fi
            fi
            unset MYSQL_PWD DBW
          fi
          echo

          # Un compteur qui inclurait les chantiers déclarés serait toujours
          # rouge, donc ignoré. Seul l'IMPRÉVU compte comme anomalie.
          echo "Anomalies : $((missing + dbko))   (routes absentes imprévues : $missing · objets de base manquants : $dbko)"
          [ "$known" -gt 0 ] && echo "Chantiers déclarés rencontrés : $known — 404 attendu, non compté."
          echo "401/403 = route en place, jeton requis."
          echo "⚠ base = objet attendu absent : la migration est enregistrée mais son effet a disparu."
          exit 0
          PROBE

      - name: Interroger les endpoints depuis le serveur
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ vars.API_BASE || '/webshop/api' }}
          # Onglet Variables OU onglet Secrets : un slug de boutique n'est pas
          # un secret, mais autant accepter les deux plutôt que rendre un
          # rapport faux parce qu'il a été posé du mauvais côté.
          SHOP_ID: ${{ vars.SHOP_ID || secrets.SHOP_ID }}
          SHOP_INPUT: ${{ inputs.shop }}
        run: |
          # Le jeton et la base partent par stdin, pas par la ligne de commande.
          { printf 'API_BASE=%q\n' "$API_BASE"
            printf 'ADMIN_TOKEN=%q\n' "${ADMIN_TOKEN:-}"
            printf 'SHOP_ID=%q\n' "${SHOP_ID:-}"
            printf 'SHOP_INPUT=%q\n' "${SHOP_INPUT:-}"
            cat probe.sh
          } | sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
                -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s
