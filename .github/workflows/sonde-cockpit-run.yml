name: Sonde — nouveau run du rapport + fonds réparé + aperçu redevances

# v3 — le run 106 généré en CLI est sorti SANS photos : le PHP CLI n'a
# probablement pas GD (rapImageGd teste imagecreatefromstring et rend null).
# Cette passe :
#  A. prouve l'état de GD en CLI ;
#  B. génère le run par HTTP loopback — le chemin EXACT du bouton « Générer »
#     du cockpit (contexte web, GD chargé) — avec repli CLI + `-d extension=gd`
#     si l'API exige une session ;
#  C. rend le PDF de CE run et le remonte en hex + sha256 ;
#  D. retire le run 106 (essai sans photos) de l'historique.

on:
  workflow_dispatch: {}

jobs:
  sonder:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Générer par la voie web et rendre le PDF
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "bash -s" <<'EOSH'
          set -u
          PHP=$(command -v php || command -v php8.2 || command -v php8.1)
          echo "===== A. GD ====="
          echo "CLI gd : $($PHP -r 'echo function_exists("imagecreatefromstring") ? "present" : "ABSENT";')"
          echo "CLI gd via -d extension=gd : $($PHP -d extension=gd -r 'echo function_exists("imagecreatefromstring") ? "present" : "ABSENT";' 2>/dev/null || echo 'chargement impossible')"

          echo "===== B. GENERATION PAR HTTP LOOPBACK ====="
          REP=$(curl -s -X POST 'http://127.0.0.1/consulant_bo/api/cockpit/rapports/6/generer' \
                -H 'Content-Type: application/json' -d '{}')
          echo "reponse : $REP"
          RUNID=$(echo "$REP" | $PHP -r '$j=json_decode(stream_get_contents(STDIN),true)?:[];echo (int)($j["runId"]??0);')
          MODE=web
          if [ "$RUNID" = "0" ]; then
            echo "voie web refusee — repli CLI avec GD charge"
            MODE=cli
          fi

          cat > /tmp/sonde_v3.php <<'EOPHP'
          <?php
          declare(strict_types=1);
          $R = '/var/www/consulant_bo';
          require $R . '/src/Db.php';
          require $R . '/src/installer.php';
          require $R . '/src/mkt_types.php';
          require $R . '/src/endpoints.php';
          require $R . '/src/writes.php';
          require $R . '/src/panel_api.php';
          require $R . '/src/erp_api.php';
          require $R . '/src/anthropic.php';
          require $R . '/src/google_api.php';
          require $R . '/src/smtp.php';
          require $R . '/src/rapports.php';
          require $R . '/src/kpis.php';
          require $R . '/src/cadence.php';
          require $R . '/src/connecteurs.php';
          require $R . '/src/mesure.php';

          $mode = (string) ($argv[1] ?? 'rendre');
          $runId = (int) ($argv[2] ?? 0);
          if ($mode === 'generer') {
              $rep = Db::row('SELECT * FROM ceo_rapport WHERE id = 6');
              if ($rep === null) { fwrite(STDERR, "rapport 6 introuvable\n"); exit(2); }
              $g = rapportGenerer($rep);
              echo json_encode($g, JSON_UNESCAPED_UNICODE) . "\n";
              exit(0);
          }
          if ($mode === 'menage106') {
              // Le run 106 : essai de sonde généré en CLI SANS GD — fiches sans
              // photos. On le retire pour ne pas polluer l'historique du rapport.
              Db::exec('DELETE FROM ceo_rapport_run WHERE id = 106 AND statut = ?', ['genere']);
              echo "run 106 retire (s'il etait encore la)\n";
              exit(0);
          }
          $run = Db::row('SELECT * FROM ceo_rapport_run WHERE id = ?', [$runId]);
          if ($run === null || $run['html'] === null) { fwrite(STDERR, "run $runId sans HTML\n"); exit(2); }
          $ctx = json_decode((string) ($run['contexte'] ?? ''), true) ?: [];
          $rep = Db::row('SELECT nom, magasins FROM ceo_rapport WHERE id = ?', [(int) ($run['rapport_id'] ?? 0)]) ?? [];
          $pdf = rapPdfRendu((string) $run['html'], [
              'magasin' => (string) ($ctx['magasin'] ?? '') !== '' ? (string) $ctx['magasin'] : rapMagasinLabel($rep),
              'rapport' => (string) ($ctx['rapport'] ?? '') !== '' ? (string) $ctx['rapport'] : (string) ($rep['nom'] ?? ''),
              'genere' => date('d/m/Y à H:i', strtotime((string) ($run['genere_le'] ?? 'now'))),
              'envoye' => '',
          ]);
          if ($pdf === null) { fwrite(STDERR, "aucun moteur PDF\n"); exit(2); }
          file_put_contents('/tmp/sonde_run3.pdf', $pdf);
          echo 'PDF : run ' . $runId . ' — ' . strlen($pdf) . ' octets — sha256 ' . hash('sha256', $pdf) . "\n";
          EOPHP

          if [ "$MODE" = "cli" ]; then
            REP=$($PHP -d extension=gd /tmp/sonde_v3.php generer)
            echo "generation CLI : $REP"
            RUNID=$(echo "$REP" | $PHP -r '$j=json_decode(stream_get_contents(STDIN),true)?:[];echo (int)($j["runId"]??0);')
          fi
          echo "run retenu : $RUNID (voie $MODE)"

          echo "===== C. RENDU PDF DU RUN $RUNID ====="
          rm -f /tmp/sonde_run3.pdf
          $PHP -d extension=gd /tmp/sonde_v3.php rendre "$RUNID"

          echo "===== D. MENAGE DU RUN 106 ====="
          $PHP /tmp/sonde_v3.php menage106

          if [ -s /tmp/sonde_run3.pdf ] && [ "$(stat -c%s /tmp/sonde_run3.pdf)" -lt 1200000 ]; then
            echo "===== E. PDF EN HEXADECIMAL ====="
            xxd -p /tmp/sonde_run3.pdf | tr -d '\n' | fold -w 240 | sed 's/^/HEX:/'
            echo ""
            echo "===== FIN HEX ====="
          fi
          EOSH

      - name: Rapatrier le PDF
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          mkdir -p /tmp/sonde
          sshpass -e scp -P ${{ vars.SSH_PORT || '22' }} \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/sonde_run3.pdf" /tmp/sonde/ \
            || echo "pas de PDF produit" > /tmp/sonde/ABSENT.txt
          ls -la /tmp/sonde/

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: sonde-cockpit-run
          path: /tmp/sonde/
          retention-days: 3
